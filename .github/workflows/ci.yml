name: CI

on: 
  push:
    branches:
      - main
  pull_request:
     branches:
      - main
  workflow_dispatch:

jobs:
    unit-tests-backend:
     runs-on: ubuntu-latest
     outputs: 
        coverage: ${{ steps.test-backend.outputs.report }}
     steps:
        - uses: actions/checkout@v4
        - name: Set up Go
          uses: actions/setup-go@v4
          with:
            go-version: '1.21'
            cache-dependency-path: /bugtracker-backend/go.sum
       
        - name: INSTALL go-junit-report
          run: |
                go install github.com/jstemmer/go-junit-report/v2@latest
 
        - name: Excecute Backend Unit Tests
          id: test-backend
          working-directory: ./bugtracker-backend
          run: |
                go test -json -coverprofile=coverage.out -covermode=atomic ./... 
                go tool cover -func=coverage.out > coverage.txt

                echo "##Generating Test Coverage  report" >> $GITHUB_STEP_SUMMARY
                echo '´´´' >> $GITHUB_STEP_SUMMARY
                cat coverage.txt >> $GITHUB_STEP_SUMMARY
                echo '´´´' >> $GITHUB_STEP_SUMMARY

                echo "report<<EOF" >> $GITHUB_OUTPUT
                cat coverage.txt >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT

                go test -v ./... 2>&1 | go-junit-report > test-results.xml

        - name: Publish Backend Test Results
          uses: dorny/test-reporter@v1
          if: always()
          with:
                name: Backend Unit Tests Reports
                path: bugtracker-backend/test-results.xml
                reporter: jest-junit
        
    unit-tests-frontend:
        runs-on: ubuntu-latest
        outputs:
            test-output: ${{ steps.test-frontend.outputs.report}}
        steps:
        - uses: actions/checkout@v4
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache-dependency-path: /bugtracker-frontend/package-lock.json
              
        - name: Excecute Frontend Unit Tests
          id: test-frontend
          working-directory: ./bugtracker-frontend
          run: |
                npm ci
                npm test | tee full_output.txt

                echo "## Frontend Test Coverage Report" >> $GITHUB_STEP_SUMMARY
                echo '´´´' >> $GITHUB_STEP_SUMMARY
                cat full_output.txt >> $GITHUB_STEP_SUMMARY
                echo '´´´' >> $GITHUB_STEP_SUMMARY

                echo "report<<EOF" >> $GITHUB_OUTPUT
                cat full_output.txt >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT

        - name: Publish Frontend Test Results
          uses: dorny/test-reporter@v1
          if: always()
          with:
            name: Frontend Unit Tests
            path: bugtracker-frontend/test-results.xml
            reporter: jest-junit

    create-coverage-comment:
        if: github.event_name == 'pull_request'
        needs: [unit-tests-backend, unit-tests-frontend]
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        steps:
        - name: Create Backend Coverage Comment
          uses: peter-evans/create-or-update-comment@v4
          with:
            issue-number: ${{ github.event.pull_request.number }}
            body: |
              ### Backend Test Coverage Report
              ´´´
              ${{ needs.unit-tests-backend.outputs.coverage }}
              ´´´

        - name: Create Front Coverage Comment
          uses: peter-evans/create-or-update-comment@v4             
          with:
            issue-number: ${{ github.event.pull_request.number }}
            body: |
              ### Frontend Test Coverage Report
              ´´´
              ${{ needs.unit-tests-frontend.outputs.test-output }}
              ´´´          

    api-e2e-tests:
      runs-on: ubuntu-latest
      needs: unit-tests-backend
      steps:
        - uses: actions/checkout@v4
        - name: Set up Go
          uses: actions/setup-go@v4
          with:
            go-version: '1.21'
            cache-dependency-path: /bugtracker-backend/go.sum
        - name: Run API E2E Tests
          working-directory: ./bugtracker-backend
          run: |
                go test -v ./e2e/...
              
    api-tests:
      needs: [unit-tests-backend, unit-tests-frontend]
      runs-on: ubuntu-latest
    
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
        
        - name: Launch Application
          run: |
            docker compose up --build -d
            npx wait -port http://localhost:8080/api/health -t  30000